    // 1단계: 형태소 나누기 화면 만들기
    function renderSegQuiz() {
      const container = document.getElementById("segQuiz");
      quizData.forEach((item, idx) => {
        const block = document.createElement("div");
        block.className = "sentence-block";

        const title = document.createElement("div");
        title.className = "sentence-text";
        title.textContent = (idx + 1) + ". " + item.sentence;
        block.appendChild(title);

        const desc = document.createElement("div");
        desc.className = "small-desc";
        desc.textContent = "형태소 단위로 나누어 적어 보세요. (슬래시 / 사용)";
        block.appendChild(desc);

        const input = document.createElement("input");
        input.type = "text";
        input.className = "seg-input";
        input.dataset.index = idx;
        input.placeholder = "예) 나/는/오늘/학교/에/가/았/다";
        block.appendChild(input);

        const btnRow = document.createElement("div");
        btnRow.className = "seg-btn-row";

        const showBtn = document.createElement("button");
        showBtn.type = "button";
        showBtn.textContent = "정답 보기 / 숨기기";
        showBtn.dataset.index = idx;
        btnRow.appendChild(showBtn);

        const clearBtn = document.createElement("button");
        clearBtn.type = "button";
        clearBtn.textContent = "입력 지우기";
        clearBtn.dataset.index = idx;
        btnRow.appendChild(clearBtn);

        block.appendChild(btnRow);

        ansDiv.className = "seg-answer";
        ansDiv.dataset.index = idx;
        ansDiv.innerHTML = "<strong>정답:</strong> " + item.segAnswer;
        block.appendChild(ansDiv);

        container.appendChild(block);

        showBtn.addEventListener("click", () => {
          ansDiv.style.display = (ansDiv.style.display === "none" || ansDiv.style.display === "") ? "block" : "none";
        });

        clearBtn.addEventListener("click", () => {
          input.value = "";
        });
      });
    }

    // 2단계: 형태소 분류 화면 만들기 (기존 클릭 퀴즈)
    function renderClassQuiz() {
      const container = document.getElementById("classQuiz");
      quizData.forEach((item, idx) => {
        const block = document.createElement("div");
        block.className = "sentence-block";

        const title = document.createElement("div");
        title.className = "sentence-text";
        title.textContent = (idx + 1) + ". " + item.sentence;
        block.appendChild(title);

        const line = document.createElement("div");
        line.className = "morpheme-line";

        item.morphemes.forEach((m) => {
          const mDiv = document.createElement("div");
          mDiv.className = "morpheme";
          mDiv.dataset.answerFree = m.free;
          mDiv.dataset.answerMeaning = m.meaning;
          mDiv.dataset.userFree = "";
          mDiv.dataset.userMeaning = "";

          const textDiv = document.createElement("div");
          textDiv.className = "morpheme-text";
          textDiv.textContent = m.text;
          mDiv.appendChild(textDiv);

          const btnRow = document.createElement("div");
          btnRow.className = "toggle-row";

          const freeBtn = document.createElement("button");
          freeBtn.type = "button";
          freeBtn.className = "toggle free";
          freeBtn.textContent = "(자립/의존)";
          freeBtn.addEventListener("click", () => {
            const current = mDiv.dataset.userFree || "";
            let next = "";
            if (current === "") next = "자립";
            else if (current === "자립") next = "의존";
            else next = "";
            mDiv.dataset.userFree = next;
            freeBtn.textContent = next || "(자립/의존)";
            mDiv.classList.remove("correct", "wrong");
          });
          btnRow.appendChild(freeBtn);

          const meanBtn = document.createElement("button");
          meanBtn.type = "button";
          meanBtn.className = "toggle meaning";
          meanBtn.textContent = "(실질/형식)";
          meanBtn.addEventListener("click", () => {
            const current = mDiv.dataset.userMeaning || "";
            let next = "";
            if (current === "") next = "실질";
            else if (current === "실질") next = "형식";
            else next = "";
            mDiv.dataset.userMeaning = next;
            meanBtn.textContent = next || "(실질/형식)";
            mDiv.classList.remove("correct", "wrong");
          });
          btnRow.appendChild(meanBtn);

          mDiv.appendChild(btnRow);
          line.appendChild(mDiv);
        });

        block.appendChild(line);
        container.appendChild(block);
      });
    }

    // 분류 채점
    function checkAnswers() {
      let total = 0;
      let correct = 0;
      let filled = 0;

      document.querySelectorAll(".morpheme").forEach((mDiv) => {
        total++;
        const ansFree = mDiv.dataset.answerFree;
        const ansMeaning = mDiv.dataset.answerMeaning;
        const userFree = mDiv.dataset.userFree;
        const userMeaning = mDiv.dataset.userMeaning;

        if (userFree && userMeaning) filled++;

        if (userFree === ansFree && userMeaning === ansMeaning) {
          mDiv.classList.add("correct");
          mDiv.classList.remove("wrong");
          correct++;
        } else {
          mDiv.classList.add("wrong");
          mDiv.classList.remove("correct");
        }
      });

      const resultDiv = document.getElementById("result");
      resultDiv.textContent =
        `채점 결과: ${correct} / ${total} 개 정답 (자립/의존 + 실질/형식을 둘 다 고른 형태소: ${filled}개)`;
    }

    // 분류 초기화
    function resetAnswers() {
      document.querySelectorAll(".morpheme").forEach((mDiv) => {
        mDiv.dataset.userFree = "";
        mDiv.dataset.userMeaning = "";
        mDiv.classList.remove("correct", "wrong");
        const freeBtn = mDiv.querySelector(".toggle.free");
        const meanBtn = mDiv.querySelector(".toggle.meaning");
        if (freeBtn) freeBtn.textContent = "(자립/의존)";
        if (meanBtn) meanBtn.textContent = "(실질/형식)";
      });
      document.getElementById("result").textContent = "";
    }

    // 탭 전환
    function setupTabs() {
      const tabSeg = document.getElementById("tabSeg");
      const tabClass = document.getElementById("tabClass");
      const panelSeg = document.getElementById("panelSeg");
      const panelClass = document.getElementById("panelClass");

      tabSeg.addEventListener("click", () => {
        tabSeg.classList.add("active");
        tabClass.classList.remove("active");
        panelSeg.style.display = "block";
        panelClass.style.display = "none";
      });

      tabClass.addEventListener("click", () => {
        tabClass.classList.add("active");
        tabSeg.classList.remove("active");
        panelClass.style.display = "block";
        panelSeg.style.display = "none";
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderSegQuiz();
      renderClassQuiz();
      setupTabs();
      document.getElementById("checkBtn").addEventListener("click", checkAnswers);
      document.getElementById("resetBtn").addEventListener("click", resetAnswers);
    });
  </script>
</body>
</html>
